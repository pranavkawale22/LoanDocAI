services:
  loandocai-api:
    container_name: loandocai-api
    build:
      context: .
      dockerfile: Dockerfile
    image: loandocai:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DOTNET_EnableDiagnostics=0
      - Webhook__SecretKey=dev_secret_loan_doc_ai_2026
      - DownstreamLos__BaseUrl=https://los.internal.bank.net
      - DownstreamLos__ApiKey=los_prod_key_mock
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
